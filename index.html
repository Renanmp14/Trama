<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trama</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0E1320; --panel:#151B2B; --panel-2:#1B2333; --panel-3:#212B3F;
    --border:#283249; --border-2:#35425C;
    --text:#D5DEEC; --muted:#7C8AA3; --faint:#566275;
    --gold:#E8B04B; --gold-dim:rgba(232,176,75,.16); --gold-line:rgba(232,176,75,.55);
    --sel:rgba(232,176,75,.24); --danger:#E0705E;
    --ui:"Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --lh:21px; --fs:13.5px; --pt:12px; --pl:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--ink); color:var(--text); font-family:var(--ui); font-size:14px;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden}
  ::selection{background:var(--sel)}
  button{font-family:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--gold); outline-offset:1px; border-radius:4px}

  /* TOP BAR */
  .topbar{display:flex; align-items:center; gap:8px; height:52px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--border); flex:0 0 auto}
  .brand{display:flex; align-items:center; gap:10px; user-select:none; margin-right:4px}
  .brand .name{font-weight:600; letter-spacing:.5px; font-size:17px}
  .brand .name b{color:var(--gold); font-weight:700}
  .toolbar{display:flex; align-items:center; gap:4px; margin-left:auto}
  .tgroup{display:flex; align-items:center; gap:2px}
  .divider{width:1px; height:24px; background:var(--border); margin:0 8px}
  .tbtn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
    border-radius:8px; background:transparent; border:1px solid transparent; color:var(--muted);
    transition:background .12s, color .12s, border-color .12s}
  .tbtn:hover{background:var(--panel-3); color:var(--text)}
  .tbtn.on{color:var(--gold); background:var(--gold-dim); border-color:rgba(232,176,75,.25)}
  .tbtn svg{width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .lang-chip{font-family:var(--mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;
    min-width:40px; height:26px; padding:0 8px; margin:0 3px; border-radius:7px; background:var(--panel-2);
    border:1px solid var(--border); color:var(--gold)}
  .lang-chip:hover{border-color:var(--border-2); background:var(--panel-3)}
  .seg{display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:9px; padding:2px}
  .seg button{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:none; border-radius:7px;
    background:transparent; color:var(--muted); font-weight:500; font-size:13px; transition:.12s}
  .seg button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .seg button.active{background:var(--gold); color:#1a1405}

  /* WORKSPACE (sidebar + col) */
  .workspace{flex:1 1 auto; display:flex; min-height:0}
  .sidebar{flex:0 0 244px; width:244px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; transition:width .16s, flex-basis .16s}
  body.no-sb .sidebar{flex-basis:0; width:0; border-right:none; overflow:hidden}
  .sb-head{display:flex; align-items:center; height:40px; padding:0 8px 0 14px; border-bottom:1px solid var(--border); flex:0 0 auto}
  .sb-title{font-size:12px; font-weight:600; letter-spacing:.4px; color:var(--muted); flex:1}
  .sb-head button{width:28px;height:28px;border-radius:7px;background:transparent;border:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .sb-head button:hover{background:var(--panel-3);color:var(--gold)}
  .sb-head button svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sb-tree{flex:1; overflow:auto; padding:6px 6px 20px}
  .sb-tree::-webkit-scrollbar{width:10px}
  .sb-tree::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px;border:3px solid var(--panel)}

  .sb-folder{display:flex; align-items:center; gap:5px; height:30px; padding:0 4px 0 4px; border-radius:7px; color:var(--muted); user-select:none}
  .sb-folder:hover{background:var(--panel-2); color:var(--text)}
  .sb-chev{width:18px;height:18px;flex:0 0 auto;background:transparent;border:none;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
  .sb-chev svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sb-folder.collapsed .sb-chev{transform:rotate(-90deg)}
  .sb-ficon{width:15px;flex:0 0 auto;color:var(--faint);display:inline-flex}
  .sb-ficon svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sb-fname{flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none}
  .sb-count{font-family:var(--mono); font-size:10.5px; color:var(--faint); padding:0 2px}
  .sb-more{width:22px;height:22px;flex:0 0 auto;background:transparent;border:none;color:var(--faint);border-radius:5px;
    display:none; align-items:center; justify-content:center}
  .sb-folder:hover .sb-more, .sb-note:hover .sb-more{display:inline-flex}
  .sb-more:hover{background:var(--panel-3);color:var(--text)}
  .sb-more svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}

  .sb-note{display:flex; align-items:center; gap:7px; height:29px; padding:0 4px 0 8px; border-radius:7px; color:var(--muted); user-select:none; position:relative}
  .sb-note.in-folder{margin-left:16px}
  .sb-note:hover{background:var(--panel-2); color:var(--text)}
  .sb-note.active{background:var(--gold-dim); color:var(--text)}
  .sb-note.active::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--gold);border-radius:2px}
  .lang-badge{flex:0 0 auto; font-family:var(--mono); font-size:9px; font-weight:500; text-transform:uppercase;
    min-width:22px; text-align:center; padding:2px 3px; border-radius:4px; background:var(--panel-3); letter-spacing:.3px}
  .sb-nname{flex:1; font-size:13px; font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none}
  .sb-open{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:0 0 auto;opacity:0}
  .sb-note.open .sb-open{opacity:.8}
  .sb-note.open.active .sb-open{opacity:0}
  .sb-section{font-size:10.5px; letter-spacing:.5px; color:var(--faint); text-transform:uppercase; padding:12px 8px 4px}
  .sb-empty{color:var(--faint); font-size:12px; padding:10px 10px; line-height:1.5}

  .colmain{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0}

  /* TABS */
  .tabstrip{display:flex; align-items:stretch; height:40px; background:var(--panel);
    border-bottom:1px solid var(--border); flex:0 0 auto; padding-left:6px; overflow-x:auto; overflow-y:hidden}
  .tabstrip::-webkit-scrollbar{height:0}
  .tab{display:flex; align-items:center; gap:8px; padding:0 8px 0 14px; max-width:230px; min-width:126px;
    border-right:1px solid var(--border); color:var(--muted); position:relative; flex:0 0 auto; user-select:none;
    border-bottom:2px solid transparent}
  .tab:hover{background:var(--panel-2); color:var(--text)}
  .tab.active{color:var(--text); background:var(--ink); border-bottom-color:var(--gold)}
  .tab .title{font-size:13px; font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
  .tab .title[contenteditable]{outline:none; cursor:text}
  .tab .disk{width:12px;height:12px;flex:0 0 auto;color:var(--faint);opacity:.7}
  .tab .disk svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.7;fill:none}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto;opacity:0;transition:opacity .12s}
  .tab.dirty .dot{opacity:1}
  .tab .x{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;
    color:var(--faint);flex:0 0 auto;background:transparent;border:none}
  .tab .x:hover{background:var(--panel-3);color:var(--danger)}
  .tab .x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
  .newtab{display:inline-flex;align-items:center;justify-content:center;width:38px;flex:0 0 auto;color:var(--muted);
    background:transparent;border:none;border-right:1px solid var(--border)}
  .newtab:hover{background:var(--panel-2);color:var(--gold)}
  .newtab svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}

  /* MAIN */
  .main{flex:1 1 auto; position:relative; min-height:0}
  .view{position:absolute; inset:0; display:none}
  .view.active{display:flex}
  #editorView{flex-direction:column}
  .editor-wrap{flex:1 1 auto; display:flex; min-height:0; position:relative}
  .gutter{flex:0 0 auto; overflow:hidden; text-align:right; user-select:none; background:var(--panel);
    border-right:1px solid var(--border); color:var(--faint); font-family:var(--mono); font-size:var(--fs);
    line-height:var(--lh); padding:var(--pt) 12px 0 14px; min-width:54px}
  .gutter-inner .n{height:var(--lh); display:flex; align-items:center; justify-content:flex-end; gap:5px}
  .gutter-inner .n.cur{color:var(--gold)}
  .fm{width:13px; height:13px; flex:0 0 auto; margin-right:auto; user-select:none; cursor:pointer;
    border:1px solid var(--border-2); border-radius:3px; background:var(--panel-2); color:var(--muted);
    font-size:10px; line-height:11px; text-align:center; font-family:var(--ui)}
  .fm:hover{color:var(--gold); border-color:var(--gold)}
  .fm.plus{color:var(--gold); border-color:var(--gold-line)}

  .editor-scroll{flex:1 1 auto; position:relative; min-width:0}
  .hl-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  #hlGuide{z-index:0} #hlBrk{z-index:1} #hlSearch{z-index:2} #hlCode{z-index:3}
  .hl-inner{font-family:var(--mono); font-size:var(--fs); line-height:var(--lh); tab-size:2;
    padding:var(--pt) 20px 0 var(--pl); white-space:pre}
  .hl-inner.wrap{white-space:pre-wrap; word-break:break-word}
  #hlGuideInner,#hlBrkInner{color:transparent}
  #hlGuideInner .ig{background-image:linear-gradient(to right, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size:2ch 100%; background-position:calc(2ch - 1px) 0}
  #hlBrkInner mark{color:transparent; border-radius:2px}
  #hlBrkInner mark.bx{background:rgba(232,176,75,.28); box-shadow:inset 0 0 0 1px var(--gold)}
  #hlBrkInner mark.bad{background:rgba(224,112,94,.28); box-shadow:inset 0 0 0 1px var(--danger)}
  #hlSearchInner{color:transparent}
  #hlSearchInner mark{background:var(--gold-dim); color:transparent; border-radius:2px}
  #hlSearchInner mark.cur{background:rgba(232,176,75,.5); box-shadow:inset 0 0 0 1px var(--gold)}
  #hlCodeInner{color:var(--text)}
  textarea.editor{position:absolute; inset:0; z-index:4; resize:none; border:none; background:transparent; color:var(--text);
    font-family:var(--mono); font-size:var(--fs); line-height:var(--lh); padding:var(--pt) 20px 40vh var(--pl);
    caret-color:var(--gold); white-space:pre; overflow:auto; tab-size:2}
  textarea.editor.wrap{white-space:pre-wrap; word-break:break-word}
  textarea.editor.code{color:transparent; -webkit-text-fill-color:transparent}
  textarea.editor:focus{outline:none}
  textarea.editor::-webkit-scrollbar{width:12px;height:12px}
  textarea.editor::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:3px solid var(--ink)}
  textarea.editor::-webkit-scrollbar-corner{background:transparent}

  /* token colors */
  .tk-com{color:#5C6B85;font-style:italic}
  .tk-str{color:#96CF86}
  .tk-num{color:#E0A458}
  .tk-key{color:#7FB2E8}
  .tk-typ{color:#5FC7BE}
  .tk-fn{color:#E8B04B}
  .tk-lit{color:#C98BD8}
  .tk-tag{color:#7FB2E8}
  .tk-att{color:#5FC7BE}
  .tk-sel{color:#E8B04B}
  .tk-prop{color:#7FB2E8}
  .tk-punc{color:#9AA7BD}

  .empty{margin:auto; text-align:center; color:var(--faint); padding:40px}
  .empty h2{font-weight:500;color:var(--muted);margin:0 0 6px}
  .empty p{margin:0;font-size:13px}
  .empty button{margin-top:16px;background:var(--gold);color:#1a1405;border:none;padding:9px 16px;border-radius:8px;font-weight:600}

  /* SEARCH / REPLACE */
  .search{position:absolute; top:10px; right:16px; z-index:6; width:340px; background:var(--panel-2);
    border:1px solid var(--border-2); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.5); padding:8px; display:none}
  .search.open{display:block}
  .search .row{display:flex; align-items:center; gap:6px; margin-bottom:6px}
  .search .row:last-child{margin-bottom:0}
  .search .ic{color:var(--faint); display:flex; flex:0 0 auto; width:18px}
  .search .ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .search input[type=text]{flex:1; min-width:0; background:var(--ink); border:1px solid var(--border); border-radius:7px;
    color:var(--text); padding:7px 9px; font-family:var(--mono); font-size:12.5px}
  .search input[type=text]:focus{outline:none; border-color:var(--gold)}
  .search .count{font-family:var(--mono); font-size:11.5px; color:var(--faint); white-space:nowrap; padding:0 2px}
  .search .nav{display:inline-flex;align-items:center;justify-content:center;width:26px;height:28px;border-radius:6px;
    background:var(--panel-3);border:1px solid var(--border);color:var(--muted)}
  .search .nav:hover{color:var(--text);border-color:var(--border-2)}
  .search .nav svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .search .closeF{background:transparent;border:none;color:var(--faint);width:28px;height:28px;border-radius:6px;flex:0 0 auto}
  .search .closeF:hover{background:var(--panel-3);color:var(--text)}
  .search .mini{background:var(--panel-3); border:1px solid var(--border); border-radius:6px; color:var(--muted);
    padding:6px 10px; font-size:12px; font-weight:500; white-space:nowrap}
  .search .mini:hover{color:var(--text); border-color:var(--border-2)}
  .search .rep{display:none; padding-top:6px; margin-top:2px; border-top:1px solid var(--border)}
  .search.replace-mode .rep{display:flex}
  .search .foot{display:flex; align-items:center; gap:12px; margin-top:8px; padding-top:7px; border-top:1px solid var(--border)}
  .search label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer}

  /* MENU (context + lang + format) */
  .menu{position:absolute; z-index:120; background:var(--panel-2); border:1px solid var(--border-2); border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.5); padding:5px; min-width:200px; max-height:70vh; overflow:auto; display:none}
  .menu.open{display:block}
  .menu button{display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--text); padding:8px 10px; border-radius:7px; font-size:13px}
  .menu button:hover{background:var(--panel-3)}
  .menu button.danger{color:var(--danger)}
  .menu button.check::after{content:"✓"; color:var(--gold)}
  .menu .k{font-family:var(--mono); font-size:11px; color:var(--faint)}
  .menu .hd{font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--faint); padding:7px 10px 3px}
  .menu .sep{height:1px;background:var(--border);margin:5px 4px}

  /* MAP */
  #mapView{overflow:hidden}
  .map-viewport{flex:1; overflow:auto; position:relative}
  .map-viewport::-webkit-scrollbar{width:12px;height:12px}
  .map-viewport::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;border:3px solid var(--ink)}
  .map-canvas{position:relative; width:2400px; height:1600px; background-color:var(--ink);
    background-image:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px; background-position:13px 13px}
  .wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .wires line{stroke:var(--gold-line); stroke-width:1.6}
  .wires line.temp{stroke:var(--gold); stroke-dasharray:5 5; opacity:.8}
  .wire-del{position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--border-2); color:var(--faint);
    display:flex;align-items:center;justify-content:center; opacity:.35; transition:.12s; z-index:6}
  .wire-del:hover{opacity:1;color:var(--danger);border-color:var(--danger)}
  .wire-del svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
  .map-node{position:absolute; width:210px; background:var(--panel-2); border:1px solid var(--border-2);
    border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.35); z-index:2; overflow:hidden}
  .map-node.active-node{border-color:var(--gold); box-shadow:0 6px 24px rgba(232,176,75,.22)}
  .map-node .head{display:flex; align-items:center; gap:8px; padding:9px 10px; cursor:grab;
    border-bottom:1px solid var(--border); background:var(--panel)}
  .map-node .head:active{cursor:grabbing}
  .map-node .mb{flex:0 0 auto; font-family:var(--mono); font-size:9px; text-transform:uppercase; padding:2px 4px; border-radius:4px; background:var(--panel-3); letter-spacing:.3px}
  .map-node .nt{flex:1; font-family:var(--mono); font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .map-node .open{width:24px;height:24px;border-radius:6px;background:transparent;border:none;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .map-node .open:hover{background:var(--panel-3);color:var(--gold)}
  .map-node .open svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .map-node .body{padding:9px 11px; font-size:12px; line-height:1.5; color:var(--muted); height:74px; overflow:hidden;
    white-space:pre-wrap; word-break:break-word; font-family:var(--mono);
    -webkit-mask-image:linear-gradient(to bottom, #000 60%, transparent); mask-image:linear-gradient(to bottom, #000 60%, transparent)}
  .map-node .body.ph{color:var(--faint); font-style:italic}
  .map-node .link{position:absolute; right:-9px; top:50%; transform:translateY(-50%); width:18px;height:18px;border-radius:50%;
    background:var(--panel); border:1.5px solid var(--gold); color:var(--gold); cursor:crosshair;
    display:flex;align-items:center;justify-content:center; z-index:3}
  .map-node .link:hover{background:var(--gold);color:#1a1405}
  .map-node .link svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
  .map-hint{position:absolute; top:12px; left:12px; z-index:4; color:var(--faint); font-size:12px;
    background:rgba(21,27,43,.8); border:1px solid var(--border); border-radius:8px; padding:7px 11px;
    backdrop-filter:blur(4px); pointer-events:none; max-width:290px; line-height:1.5}
  .map-hint b{color:var(--muted);font-weight:500}

  /* STATUS */
  .status{display:flex; align-items:center; height:28px; flex:0 0 auto; background:var(--panel);
    border-top:1px solid var(--border); font-family:var(--mono); font-size:11.5px; color:var(--muted); padding:0 12px}
  .status .item{padding:0 12px; border-right:1px solid var(--border); white-space:nowrap}
  .status .item:first-child{padding-left:0}
  .status .grow{flex:1; border:none}
  .status .r{color:var(--faint)}
  .status .clk{cursor:pointer; color:var(--muted)}
  .status .clk:hover{color:var(--gold)}

  /* MODAL */
  .modal-back{position:fixed; inset:0; background:rgba(6,9,15,.6); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:200}
  .modal-back.open{display:flex}
  .modal{background:var(--panel-2); border:1px solid var(--border-2); border-radius:14px; width:420px; max-width:calc(100vw - 40px);
    box-shadow:0 24px 60px rgba(0,0,0,.6); padding:22px}
  .modal h3{margin:0 0 8px; font-size:16px; font-weight:600}
  .modal p{margin:0 0 20px; font-size:13.5px; color:var(--muted); line-height:1.5}

  /* TOAST */

  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--gold);font-weight:600}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const set = (...a) => new Set(a);
  const CW = 8.11;

  /* ============ LINGUAGENS ============ */
  const esc = s => s.replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function tokenize(code, rules){
    let i=0, out="";
    const L=code.length;
    while(i<L){
      let hit=false;
      for(const r of rules){
        r.re.lastIndex=i;
        const m=r.re.exec(code);
        if(m && m.index===i && m[0].length>0){
          const text=m[0];
          let type=r.type;
          if(r.cls) type=r.cls(text, code, i+text.length);
          out += type ? '<span class="tk-'+type+'">'+esc(text)+'</span>' : esc(text);
          i+=text.length; hit=true; break;
        }
      }
      if(!hit){ out+=esc(code[i]); i++; }
    }
    return out;
  }

  function clike(cfg){
    const rules=[];
    if(cfg.block!==false) rules.push({re:/\/\*[\s\S]*?\*\//y, type:"com"});
    if(cfg.dash){ rules.push({re:/--\[\[[\s\S]*?\]\]/y, type:"com"}); rules.push({re:/--[^\n]*/y, type:"com"}); }
    if(cfg.hash) rules.push({re:/#[^\n]*/y, type:"com"});
    if(cfg.preproc) rules.push({re:/#[ \t]*[a-zA-Z]+/y, type:"key"});
    if(cfg.line!==false) rules.push({re:/\/\/[^\n]*/y, type:"com"});
    if(cfg.triple){ rules.push({re:/[rbfRBF]{0,2}"""[\s\S]*?"""/y, type:"str"}); rules.push({re:/[rbfRBF]{0,2}'''[\s\S]*?'''/y, type:"str"}); }
    if(cfg.longstr) rules.push({re:/\[\[[\s\S]*?\]\]/y, type:"str"});
    if(cfg.template) rules.push({re:/`(?:\\.|[^`\\])*`/y, type:"str"});
    const pre = cfg.sprefix || "";
    rules.push({re:new RegExp(pre+'"(?:""|\\\\.|[^"\\\\])*"', "y"), type:"str"});
    rules.push({re:new RegExp(pre+"'(?:\\\\.|[^'\\\\])*'", "y"), type:"str"});
    rules.push({re:/0[xX][0-9a-fA-F]+|(?:\d[\d_]*)(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?/y, type:"num"});
    const ci=!!cfg.ci;
    const KW=new Set((cfg.kw||[]).map(x=>ci?x.toUpperCase():x));
    const TY=new Set((cfg.types||[]).map(x=>ci?x.toUpperCase():x));
    const LI=new Set(cfg.lits||[]);
    rules.push({re:/[A-Za-z_$][A-Za-z0-9_$]*/y, cls:(t,code,end)=>{
      if(LI.has(t)) return "lit";
      const key=ci?t.toUpperCase():t;
      if(KW.has(key)) return "key";
      if(TY.has(key)) return "typ";
      let j=end; while(j<code.length && (code[j]===" "||code[j]==="\t")) j++;
      if(code[j]==="(") return "fn";
      return null;
    }});
    rules.push({re:/[{}()\[\];,]/y, type:"punc"});
    return rules;
  }

  const jsonRules=[
    {re:/"(?:\\.|[^"\\])*"/y, cls:(t,code,end)=>{ let j=end; while(j<code.length && /\s/.test(code[j])) j++; return code[j]===":" ? "prop":"str"; }},
    {re:/\b(?:true|false|null)\b/y, type:"lit"},
    {re:/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/y, type:"num"},
    {re:/[{}\[\],:]/y, type:"punc"},
  ];
  const htmlRules=[
    {re:/<!--[\s\S]*?-->/y, type:"com"},
    {re:/<![^>]*>/y, type:"com"},
    {re:/<\/?[A-Za-z][A-Za-z0-9:-]*/y, type:"tag"},
    {re:/"(?:[^"]*)"|'(?:[^']*)'/y, type:"str"},
    {re:/[A-Za-z_:][A-Za-z0-9_:.-]*(?==)/y, type:"att"},
    {re:/\/?>/y, type:"tag"},
    {re:/&[a-zA-Z#0-9]+;/y, type:"lit"},
  ];
  const cssRules=[
    {re:/\/\*[\s\S]*?\*\//y, type:"com"},
    {re:/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/y, type:"str"},
    {re:/@[\w-]+/y, type:"key"},
    {re:/!important\b/y, type:"key"},
    {re:/[.#]?[A-Za-z_][\w-]*(?=[^;{}]*\{)/y, type:"sel"},
    {re:/#[0-9a-fA-F]{3,8}\b/y, type:"num"},
    {re:/[A-Za-z-]+(?=\s*:)/y, type:"prop"},
    {re:/-?\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr|pt|ch|ex|cm|mm)?/y, type:"num"},
    {re:/[{}:;,]/y, type:"punc"},
  ];

  const JS = clike({ template:true,
    kw:["const","let","var","function","return","if","else","for","while","do","switch","case","break","continue","new","class","extends","super","this","typeof","instanceof","in","of","try","catch","finally","throw","async","await","yield","import","export","from","default","delete","void","debugger","static","get","set","as"],
    lits:["true","false","null","undefined","NaN","Infinity"],
    types:["console","Math","JSON","Object","Array","String","Number","Boolean","Promise","Date","RegExp","Map","Set","Symbol","document","window","require","module","exports","process","__dirname","__filename","Buffer","global"] });

  const LANGS = {
    text:   { name:"Texto simples", badge:"txt", color:"#7C8AA3", rules:null, exts:["txt","md","log"] },
    js:     { name:"JavaScript", badge:"js", color:"#E8C15A", rules:JS, exts:["js","mjs","cjs"] },
    node:   { name:"Node.js", badge:"node", color:"#96CF86", rules:JS, exts:[] },
    ts:     { name:"TypeScript", badge:"ts", color:"#7FB2E8", rules:JS, exts:["ts"] },
    java:   { name:"Java", badge:"java", color:"#E0705E", exts:["java"], rules: clike({
      kw:["abstract","assert","break","case","catch","class","const","continue","default","do","else","enum","extends","final","finally","for","goto","if","implements","import","instanceof","interface","native","new","package","private","protected","public","return","static","strictfp","super","switch","synchronized","this","throw","throws","transient","try","volatile","while","var","record","yield","sealed","permits","boolean","byte","char","double","float","int","long","short","void"],
      lits:["true","false","null"],
      types:["String","Integer","Boolean","Double","Float","Long","Object","System","List","Map","ArrayList","HashMap","Set","Exception","Override","Math","Optional","Stream"] }) },
    python: { name:"Python", badge:"py", color:"#7FB2E8", exts:["py","pyw"], rules: clike({ hash:true, block:false, line:false, triple:true, sprefix:"[rbfRBF]{0,2}",
      kw:["def","class","return","if","elif","else","for","while","break","continue","pass","import","from","as","with","try","except","finally","raise","lambda","global","nonlocal","yield","assert","del","in","is","not","and","or","async","await","match","case"],
      lits:["True","False","None"],
      types:["print","len","range","int","str","float","list","dict","set","tuple","bool","open","type","isinstance","super","self","enumerate","zip","map","filter","sorted","sum","min","max","abs","input","format"] }) },
    c:      { name:"C", badge:"c", color:"#8FA0B8", exts:["c","h"], rules: clike({ preproc:true,
      kw:["auto","break","case","char","const","continue","default","do","double","else","enum","extern","float","for","goto","if","inline","int","long","register","restrict","return","short","signed","sizeof","static","struct","switch","typedef","union","unsigned","void","volatile","while","bool","_Bool"],
      lits:["NULL","true","false"],
      types:["size_t","FILE","int8_t","int16_t","int32_t","int64_t","uint8_t","uint16_t","uint32_t","uint64_t"] }) },
    csharp: { name:"C#", badge:"c#", color:"#A07FE0", exts:["cs"], rules: clike({ sprefix:"[@$]{0,2}",
      kw:["abstract","as","base","break","case","catch","checked","class","const","continue","default","delegate","do","else","enum","event","explicit","extern","finally","fixed","for","foreach","goto","if","implicit","in","interface","internal","is","lock","namespace","new","operator","out","override","params","private","protected","public","readonly","ref","return","sealed","sizeof","stackalloc","static","struct","switch","this","throw","try","typeof","unchecked","unsafe","using","virtual","volatile","while","async","await","yield","get","set","value","record","when","bool","byte","char","decimal","double","float","int","long","object","sbyte","short","string","uint","ulong","ushort","void","var","dynamic"],
      lits:["true","false","null"],
      types:["Console","String","Int32","List","Task","Dictionary","Exception","Object","DateTime","IEnumerable","Func","Action"] }) },
    lua:    { name:"Lua", badge:"lua", color:"#7FA0E8", exts:["lua"], rules: clike({ dash:true, block:false, line:false, longstr:true,
      kw:["and","break","do","else","elseif","end","for","function","goto","if","in","local","not","or","repeat","return","then","until","while"],
      lits:["true","false","nil"],
      types:["print","pairs","ipairs","type","tostring","tonumber","require","table","string","math","os","io","pcall","xpcall","error","assert","setmetatable","getmetatable","select","next","rawget","rawset","self"] }) },
    sql:    { name:"SQL", badge:"sql", color:"#5FC7BE", exts:["sql"], rules: clike({ dash:true, block:true, line:false, ci:true,
      kw:["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","CREATE","TABLE","ALTER","DROP","JOIN","INNER","LEFT","RIGHT","OUTER","FULL","CROSS","ON","USING","AS","AND","OR","NOT","NULL","IS","IN","LIKE","ILIKE","BETWEEN","GROUP","BY","ORDER","ASC","DESC","HAVING","LIMIT","OFFSET","DISTINCT","UNION","ALL","CASE","WHEN","THEN","ELSE","END","EXISTS","PRIMARY","KEY","FOREIGN","REFERENCES","INDEX","VIEW","DEFAULT","CONSTRAINT","UNIQUE","CHECK","WITH","RETURNING","TRUNCATE","BEGIN","COMMIT","ROLLBACK","GRANT","REVOKE","OVER","PARTITION"],
      lits:["true","false","null","TRUE","FALSE","NULL"],
      types:["INT","INTEGER","BIGINT","SMALLINT","VARCHAR","CHAR","TEXT","DATE","DATETIME","TIMESTAMP","TIME","BOOLEAN","BOOL","DECIMAL","NUMERIC","FLOAT","REAL","DOUBLE","SERIAL","BIGSERIAL","UUID","JSON","JSONB","BYTEA"] }) },
    json:   { name:"JSON", badge:"json", color:"#96CF86", rules:jsonRules, exts:["json"] },
    css:    { name:"CSS", badge:"css", color:"#7FB2E8", rules:cssRules, exts:["css"] },
    html:   { name:"HTML", badge:"html", color:"#E08A5E", rules:htmlRules, exts:["html","htm","xml"] },
  };
  const highlight = (code, lang) => tokenize(code, LANGS[lang].rules);
  function detectLangExt(name){
    const m=/\.(\w+)$/.exec(name||""); if(!m) return null;
    const ext=m[1].toLowerCase();
    for(const k in LANGS) if((LANGS[k].exts||[]).includes(ext)) return k;
    return null;
  }

  /* ============ ESTADO ============ */
  let notes=[], folders=[], openIds=[], activeId=null, connections=[];
  let uid=1, fuid=1, view="editor";
  const settings={ wrap:false, lineNumbers:true, sidebar:true, autopair:true };
  const search={ q:"", idx:-1, matches:[], caseSensitive:false, mode:"find" };
  const FS=("showOpenFilePicker" in window);

  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const ensureExt = n => /\.\w+$/.test(n) ? n : n + ".txt";
  const getNote = id => notes.find(n=>n.id===id);
  const activeNote = () => getNote(activeId);
  const getFolder = id => folders.find(f=>f.id===id);
  const searchOpen = () => $("#searchPanel").classList.contains("open");
  function uniq(base, arr, key){ let t=base, i=1; while(arr.some(x=>x[key]===t)){ const m=base.match(/^(.*?)(\.\w+)?$/); t=m[1]+" ("+(i++)+")"+(m[2]||""); } return t; }
  function toast(html){ const el=$("#toast"); el.innerHTML=html; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2000); }

  /* ============ NOTAS / PASTAS ============ */
  function createNote(o){
    o=o||{};
    const t={ id:uid++, title:o.title||uniq("nota.txt",notes,"title"), content:o.content||"", dirty:false, folds:[],
      handle:o.handle||null, lang:o.lang||detectLangExt(o.title)||"text", folderId:o.folderId||null,
      x:(o.x!=null?o.x:70+((notes.length*46)%880)), y:(o.y!=null?o.y:80+Math.floor(notes.length/5)*180+((notes.length%5)*8)) };
    notes.push(t);
    if(o.open!==false){ if(!openIds.includes(t.id)) openIds.push(t.id); activeId=t.id; }
    renderAll();
    if(o.open!==false){ setView("editor"); loadEditor(); const ed=$("#editor"); if(ed) ed.focus(); }
    return t;
  }
  async function deleteNote(id){
    const t=getNote(id); if(!t) return;
    const ok=await modal({ title:"Excluir nota", msg:"Excluir <b>"+esc(t.title)+"</b> definitivamente? Isso remove a nota do Trama (não afeta arquivos já salvos no computador).",
      buttons:[{label:"Cancelar",value:false,cls:"ghost"},{label:"Excluir",value:true,cls:"danger"}] });
    if(!ok) return;
    notes=notes.filter(n=>n.id!==id);
    openIds=openIds.filter(o=>o!==id);
    connections=connections.filter(c=>c.a!==id&&c.b!==id);
    if(activeId===id) activeId=openIds.length?openIds[openIds.length-1]:null;
    renderAll(); loadEditor();
  }
  function setNoteFolder(id, fid){ const t=getNote(id); if(t){ t.folderId=fid; renderSidebar(); } }
  function createFolder(){ folders.push({ id:"f"+(fuid++), name:uniq("Pasta",folders,"name"), collapsed:false }); renderSidebar(); }
  function deleteFolder(fid){ notes.forEach(n=>{ if(n.folderId===fid) n.folderId=null; }); folders=folders.filter(f=>f.id!==fid); renderSidebar(); toast("Pasta removida — notas foram para <b>Sem pasta</b>"); }
  function toggleFolder(fid){ const f=getFolder(fid); if(f){ f.collapsed=!f.collapsed; renderSidebar(); } }

  function renderAll(){ renderTabs(); renderSidebar(); renderMapNodes(); redrawWires(); }

  /* ============ ABAS ============ */
  const tabstrip=$("#tabstrip");
  function openNote(id){
    const t=getNote(id); if(!t) return;
    if(!openIds.includes(id)) openIds.push(id);
    activeId=id; renderTabs(); renderSidebar(); renderMapNodes();
    setView("editor"); loadEditor(); const ed=$("#editor"); if(ed) ed.focus();
  }
  function closeTab(id){
    const i=openIds.indexOf(id); if(i<0) return;
    openIds.splice(i,1);
    if(activeId===id) activeId=openIds.length?openIds[Math.min(i,openIds.length-1)]:null;
    renderTabs(); renderSidebar(); loadEditor();
  }
  function renderTabs(){
    tabstrip.innerHTML="";
    openIds.forEach(id=>{
      const t=getNote(id); if(!t) return;
      const el=document.createElement("div");
      el.className="tab"+(id===activeId?" active":"")+(t.dirty?" dirty":"");
      el.dataset.id=id;
      const disk=t.handle?'<span class="disk" title="Ligada a um arquivo do computador"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/></svg></span>':"";
      el.innerHTML=disk+'<span class="dot"></span><span class="title" title="'+esc(t.title)+'">'+esc(t.title)+'</span>'
        +'<button class="x" aria-label="Fechar aba"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      el.addEventListener("mousedown", e=>{ if(e.target.closest(".x")) return; openNote(id); });
      el.querySelector(".x").addEventListener("click", e=>{ e.stopPropagation(); closeTab(id); });
      const ti=el.querySelector(".title");
      ti.addEventListener("dblclick", ()=> inlineRename(ti, ()=>t.title, v=>{ t.title=v; const dl=detectLangExt(v); if(dl) t.lang=dl; }, ()=>{ renderAll(); loadEditor(); }));
      tabstrip.appendChild(el);
    });
    const add=document.createElement("button");
    add.className="newtab"; add.title="Nova nota"; add.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
    add.addEventListener("click", ()=> createNote({}));
    tabstrip.appendChild(add);
  }

  function inlineRename(el, getV, setV, after){
    el.setAttribute("contenteditable","true"); el.textContent=getV();
    const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); el.focus();
    const fin=()=>{ el.removeAttribute("contenteditable"); const v=el.textContent.trim(); if(v) setV(v); after&&after(); };
    el.addEventListener("blur", fin, {once:true});
    el.addEventListener("keydown", e=>{ e.stopPropagation(); if(e.key==="Enter"){e.preventDefault();el.blur();} if(e.key==="Escape"){el.textContent=getV();el.blur();} });
  }

  /* ============ SIDEBAR ============ */
  const sbTree=$("#sbTree");
  function noteRow(t){
    const L=LANGS[t.lang]||LANGS.text;
    const el=document.createElement("div");
    el.className="sb-note"+(t.folderId?" in-folder":"")+(t.id===activeId?" active":"")+(openIds.includes(t.id)?" open":"");
    el.dataset.id=t.id;
    el.innerHTML='<span class="lang-badge" style="color:'+L.color+'">'+L.badge+'</span>'
      +'<span class="sb-nname" title="'+esc(t.title)+'">'+esc(t.title)+'</span>'
      +'<span class="sb-open"></span>'
      +'<button class="sb-more" aria-label="Opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>';
    el.addEventListener("click", e=>{ if(e.target.closest(".sb-more")) return; openNote(t.id); });
    const name=el.querySelector(".sb-nname");
    name.addEventListener("dblclick", e=>{ e.stopPropagation(); inlineRename(name, ()=>t.title, v=>{ t.title=v; const dl=detectLangExt(v); if(dl) t.lang=dl; }, ()=>{ renderAll(); loadEditor(); }); });
    el.querySelector(".sb-more").addEventListener("click", e=>{ e.stopPropagation(); noteMenu(e, t.id); });
    el.addEventListener("contextmenu", e=>{ e.preventDefault(); noteMenu(e, t.id); });

  }
  function renderSidebar(){
    sbTree.innerHTML="";
    folders.forEach(f=>{
      const kids=notes.filter(n=>n.folderId===f.id);
      const fel=document.createElement("div");
      fel.className="sb-folder"+(f.collapsed?" collapsed":"");
      fel.innerHTML='<button class="sb-chev"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>'
        +'<span class="sb-ficon"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>'
        +'<span class="sb-fname" title="'+esc(f.name)+'">'+esc(f.name)+'</span>'
        +'<span class="sb-count">'+kids.length+'</span>'
        +'<button class="sb-more" aria-label="Opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>';
      fel.querySelector(".sb-chev").addEventListener("click", e=>{ e.stopPropagation(); toggleFolder(f.id); });
      fel.addEventListener("click", e=>{ if(e.target.closest(".sb-more")||e.target.closest(".sb-fname[contenteditable]")) return; toggleFolder(f.id); });
      const fn=fel.querySelector(".sb-fname");
      fn.addEventListener("dblclick", e=>{ e.stopPropagation(); inlineRename(fn, ()=>f.name, v=>{f.name=v;}, renderSidebar); });
      fel.querySelector(".sb-more").addEventListener("click", e=>{ e.stopPropagation(); folderMenu(e, f.id); });
      fel.addEventListener("contextmenu", e=>{ e.preventDefault(); folderMenu(e, f.id); });
      sbTree.appendChild(fel);
      if(!f.collapsed) kids.forEach(n=> sbTree.appendChild(noteRow(n)));
    });
    const loose=notes.filter(n=>!n.folderId);
    if(folders.length && loose.length){ const s=document.createElement("div"); s.className="sb-section"; s.textContent="Sem pasta"; sbTree.appendChild(s); }
    loose.forEach(n=> sbTree.appendChild(noteRow(n)));
    if(!notes.length){ const e=document.createElement("div"); e.className="sb-empty"; e.textContent="Nenhuma nota ainda. Use + para criar."; sbTree.appendChild(e); }
  }

  /* ============ MENUS ============ */
  const menuEl=$("#menu");
  function showMenu(x,y,items){
    menuEl.innerHTML="";
    items.forEach(it=>{
      if(it.sep){ const d=document.createElement("div"); d.className="sep"; menuEl.appendChild(d); return; }
      if(it.hd){ const h=document.createElement("div"); h.className="hd"; h.textContent=it.hd; menuEl.appendChild(h); return; }
      const b=document.createElement("button");
      if(it.danger) b.className="danger"; if(it.check) b.className=(b.className+" check").trim();
      b.innerHTML='<span>'+esc(it.label)+'</span>'+(it.k?'<span class="k">'+esc(it.k)+'</span>':"");
      b.addEventListener("click", ()=>{ menuEl.classList.remove("open"); it.action&&it.action(); });
      menuEl.appendChild(b);
    });
    menuEl.style.left="0px"; menuEl.style.top="0px"; menuEl.classList.add("open");
    const w=menuEl.offsetWidth, h=menuEl.offsetHeight;
    menuEl.style.left=Math.min(x, window.innerWidth-w-8)+"px";
    menuEl.style.top=Math.min(y, window.innerHeight-h-8)+"px";
  }
  // pointerdown dispara ANTES do click que abre o menu — assim o clique de abertura não fecha o próprio menu
  document.addEventListener("pointerdown", e=>{ if(!menuEl.contains(e.target)) menuEl.classList.remove("open"); });

  function noteMenu(e, id){
    const t=getNote(id); if(!t) return;
    const items=[{label:"Abrir", action:()=>openNote(id)}, {label:"Renomear", action:()=>{ renderSidebar(); const el=sbTree.querySelector('.sb-note[data-id="'+id+'"] .sb-nname'); if(el) inlineRename(el, ()=>t.title, v=>{t.title=v; const dl=detectLangExt(v); if(dl) t.lang=dl;}, ()=>{renderAll();loadEditor();}); }}];
    items.push({sep:true},{hd:"Mover para"});
    items.push({label:"Sem pasta", action:()=>setNoteFolder(id,null)});
    folders.forEach(f=> items.push({label:f.name, action:()=>setNoteFolder(id,f.id)}));
    items.push({sep:true});
    if(openIds.includes(id)) items.push({label:"Fechar aba", action:()=>closeTab(id)});
    items.push({label:"Excluir", danger:true, action:()=>deleteNote(id)});
    showMenu(e.clientX, e.clientY, items);
  }
  function folderMenu(e, fid){
    const f=getFolder(fid); if(!f) return;
    showMenu(e.clientX, e.clientY, [
      {label:"Nova nota aqui", action:()=>createNote({folderId:fid})},
      {label:"Renomear", action:()=>{ const el=sbTree.querySelector(".sb-folder .sb-fname"); /* re-find */ const all=[...sbTree.querySelectorAll(".sb-fname")]; const idx=folders.indexOf(f); const target=all[idx]; if(target) inlineRename(target, ()=>f.name, v=>{f.name=v;}, renderSidebar); }},
      {sep:true},
      {label:"Excluir pasta", danger:true, action:()=>deleteFolder(fid)}
    ]);
  }
  function openLangMenu(x, y, upward){
    const t=activeNote(); if(!t){ toast("Nenhuma nota aberta."); return; }
    const items=Object.keys(LANGS).filter(k=>k!=="ts").map(k=>({ label:LANGS[k].name, check:t.lang===k,
      action:()=>{ t.lang=k; renderSidebar(); renderMapNodes(); loadEditor(); toast("Linguagem: <b>"+esc(LANGS[k].name)+"</b>"); } }));
    showMenu(x, y, items);
    if(upward){ const h=menuEl.offsetHeight; menuEl.style.top=Math.max(8, y-h-6)+"px"; }
  }
  $("#stLang").addEventListener("click", e=>{ const r=e.currentTarget.getBoundingClientRect(); openLangMenu(r.left, r.top, true); });
  $("#btnLang").addEventListener("click", e=>{ const r=e.currentTarget.getBoundingClientRect(); openLangMenu(r.left, r.bottom+6, false); });

  /* ============ EDITOR ============ */
  const editorWrap=$("#editorWrap");
  function curLang(){ const t=activeNote(); return t?t.lang:"text"; }
  function isCode(){ const l=curLang(); return l!=="text" && LANGS[l] && LANGS[l].rules; }

  function loadEditor(){
    const t=activeNote();
    if(!t){ editorWrap.innerHTML='<div class="empty"><h2>Sem notas abertas</h2><p>Escolha uma nota na barra lateral ou crie uma nova.</p><button id="emptyNew">Nova nota</button></div>'; $("#emptyNew").addEventListener("click",()=>createNote({})); updateStatus(); return; }
    editorWrap.innerHTML='<div class="gutter" id="gutter"><div class="gutter-inner" id="gutterInner"></div></div>'
      +'<div class="editor-scroll" id="editorScroll">'
      +'<div class="hl-layer" id="hlGuide"><div class="hl-inner" id="hlGuideInner"></div></div>'
      +'<div class="hl-layer" id="hlBrk"><div class="hl-inner" id="hlBrkInner"></div></div>'
      +'<div class="hl-layer" id="hlSearch"><div class="hl-inner" id="hlSearchInner"></div></div>'
      +'<div class="hl-layer" id="hlCode"><div class="hl-inner" id="hlCodeInner"></div></div>'
      +'<textarea class="editor" id="editor" spellcheck="false" placeholder="Comece a escrever…"></textarea></div>';
    bindEditor();
    $("#gutter").addEventListener("click", e=>{ const fm=e.target.closest(".fm"); if(!fm) return; const L=+fm.dataset.l; if(fm.classList.contains("plus")) unfoldAt(L); else foldAt(L); });
    const ed=$("#editor"); ed.value=t.content; lastVal=ed.value; lastBrk=null;
    const wrap=settings.wrap;
    ed.classList.toggle("wrap", wrap);
    ["#hlGuideInner","#hlBrkInner","#hlSearchInner","#hlCodeInner"].forEach(s=>$(s).classList.toggle("wrap", wrap));
    ed.classList.toggle("code", !!isCode());
    $("#gutter").style.display=settings.lineNumbers?"":"none";
    renderGutter(); renderCode(); renderGuides(); syncScroll(); updateStatus();
    if(searchOpen() && search.q) recomputeSearch(true); else clearHighlights();
  }
  function bindEditor(){
    const ed=$("#editor");
    ed.addEventListener("input", ()=> syncEdited(ed));
    ed.addEventListener("scroll", syncScroll);
    ed.addEventListener("keyup", updateStatus);
    ed.addEventListener("click", updateStatus);
    ed.addEventListener("select", updateStatus);
    ed.addEventListener("keydown", editorKeys);
  }
  function markDirty(id){ const el=tabstrip.querySelector('.tab[data-id="'+id+'"]'); if(el) el.classList.add("dirty"); }
  function syncEdited(ed){
    foldShift(ed); lastVal=ed.value;
    const t=activeNote(); if(t){ t.content=ed.value; if(!t.dirty){ t.dirty=true; markDirty(t.id); } }
    renderGutter(); renderCode(); renderGuides(); updateStatus(); updateNodePreview(activeId);
    if(searchOpen() && search.q) recomputeSearch(false);
  }

  function renderGutter(){
    if(!settings.lineNumbers) return;
    const ed=$("#editor"), gi=$("#gutterInner"), t=activeNote(); if(!ed||!gi) return;
    const lines=ed.value.split("\n"), cur=curLine(ed);
    const folds=(t&&t.folds)||[];
    const addAt={}, foldedHeader={};
    folds.forEach(f=>{ const L=lineOfPos(ed.value,f.pos); addAt[L]=(addAt[L]||0)+f.count; foldedHeader[L-1]=true; });
    let add=0, h="", maxNum=lines.length;
    for(let i=0;i<lines.length;i++){
      if(addAt[i]) add+=addAt[i];
      const num=i+1+add; maxNum=num;
      let mark="";
      if(foldedHeader[i]) mark='<span class="fm plus" data-l="'+i+'" title="Expandir bloco">+</span>';
      else if(isFoldable(lines,i)) mark='<span class="fm" data-l="'+i+'" title="Recolher bloco">−</span>';
      h+='<div class="n'+((i+1)===cur?" cur":"")+'">'+mark+num+'</div>';
    }
    gi.innerHTML=h;
    $("#gutter").style.minWidth=(Math.max(2,String(maxNum).length)*9+46)+"px";
  }

  /* ============ DOBRAS DE CÓDIGO (FOLDING) ============ */
  let lastVal="", lastBrk=null;
  function lineOfPos(v,p){ let n=0; for(let i=0;i<p;i++) if(v.charCodeAt(i)===10) n++; return n; }
  function offsetOfLine(v,L){ if(L<=0) return 0; let n=0; for(let i=0;i<v.length;i++){ if(v.charCodeAt(i)===10){ n++; if(n===L) return i+1; } } return v.length; }
  function stripQuick(l){ return l.replace(/(["'`])(?:\\.|(?!\1).)*\1/g,"").replace(/\/\/.*$/,"").replace(/--.*$/,""); }
  function netOpen(l){ const s=stripQuick(l); let n=0; for(const ch of s){ if(ch==="{"||ch==="("||ch==="[") n++; else if(ch==="}"||ch===")"||ch==="]") n--; } return n; }
  const indentOf=l=>(l.match(/^[ \t]*/)||[""])[0].replace(/\t/g,"  ").length;
  function isFoldable(lines,i){
    const l=lines[i]; if(!l.trim()) return false;
    if(netOpen(l)>0) return true;
    const nx=lines[i+1];
    return !!(nx!==undefined && nx.trim() && indentOf(nx)>indentOf(l));
  }
  function foldableEnd(lines,i){
    const l=lines[i]; if(!l.trim()) return -1;
    let net=netOpen(l);
    if(net>0){
      let d=net;
      for(let j=i+1;j<lines.length;j++){ d+=netOpen(lines[j]); if(d<=0) return j; }
      return lines.length-1;
    }
    const ind=indentOf(l);
    if(i+1<lines.length && lines[i+1].trim() && indentOf(lines[i+1])>ind){
      let j=i+1;
      while(j<lines.length && (!lines[j].trim() || indentOf(lines[j])>ind)) j++;
      let e=j-1; while(e>i && !lines[e].trim()) e--;
      return e>i?e:-1;
    }
    return -1;
  }
  function refreshAfterFold(){
    renderGutter(); renderCode(); renderGuides(); updateStatus(); syncScroll();
    if(searchOpen() && search.q) recomputeSearch(false);
  }
  function expandFold(t, ed, f){
    ed.value=ed.value.slice(0,f.pos)+f.text+ed.value.slice(f.pos);
    t.folds=t.folds.filter(x=>x!==f);
    t.folds.forEach(x=>{ if(x.pos>=f.pos) x.pos+=f.text.length; });
    lastVal=ed.value; t.content=ed.value;
  }
  function foldAt(L){
    const ed=$("#editor"), t=activeNote(); if(!ed||!t) return;
    for(let guard=0; guard<20; guard++){
      const v=ed.value, lines=v.split("\n");
      const end=foldableEnd(lines,L); if(end<=L) return;
      const hStart=offsetOfLine(v,L+1);
      const hEnd=end+1<lines.length ? offsetOfLine(v,end+1) : v.length;
      const inner=t.folds.filter(f=>f.pos>=hStart && f.pos<=hEnd);
      if(!inner.length){
        const hidden=v.slice(hStart,hEnd);
        if(!hidden) return;
        t.folds.forEach(f=>{ if(f.pos>=hEnd) f.pos-=hidden.length; });
        t.folds.push({pos:hStart, text:hidden, count:end-L});
        const nv=v.slice(0,hStart)+v.slice(hEnd);
        ed.value=nv; lastVal=nv; t.content=nv;
        const c=Math.min(hStart, nv.length); ed.setSelectionRange(c,c);
        refreshAfterFold(); return;
      }
      inner.sort((a,b)=>b.pos-a.pos).forEach(f=>expandFold(t,ed,f));
    }
  }
  function unfoldAt(L){
    const ed=$("#editor"), t=activeNote(); if(!ed||!t) return;
    const f=t.folds.find(x=>lineOfPos(ed.value,x.pos)-1===L); if(!f) return;
    expandFold(t,ed,f); refreshAfterFold();
  }
  function unfoldAll(silent){
    const ed=$("#editor"), t=activeNote(); if(!ed||!t||!t.folds||!t.folds.length) return false;
    [...t.folds].sort((a,b)=>b.pos-a.pos).forEach(f=>expandFold(t,ed,f));
    refreshAfterFold();
    if(!silent) toast("Blocos dobrados foram expandidos.");
    return true;
  }
  function getFullText(t){
    if(!t || !t.folds || !t.folds.length) return t?t.content:"";
    let v=t.content;
    [...t.folds].sort((a,b)=>b.pos-a.pos).forEach(f=>{ v=v.slice(0,f.pos)+f.text+v.slice(f.pos); });
    return v;
  }
  function foldShift(ed){
    const t=activeNote(); if(!t||!t.folds||!t.folds.length) return;
    const oldV=lastVal, newV=ed.value; if(oldV===newV) return;
    let a=0; const min=Math.min(oldV.length,newV.length);
    while(a<min && oldV.charCodeAt(a)===newV.charCodeAt(a)) a++;
    let bo=oldV.length, bn=newV.length;
    while(bo>a && bn>a && oldV.charCodeAt(bo-1)===newV.charCodeAt(bn-1)){ bo--; bn--; }
    const delta=bn-bo, burst=[];
    t.folds.forEach(f=>{ if(f.pos<=a) return; if(f.pos>=bo){ f.pos+=delta; return; } burst.push(f); });
    if(burst.length){
      let ins=Math.min(bn, ed.value.length);
      burst.sort((x,y)=>x.pos-y.pos).forEach(f=>{
        ed.value=ed.value.slice(0,ins)+f.text+ed.value.slice(ins);
        t.folds=t.folds.filter(z=>z!==f);
        t.folds.forEach(z=>{ if(z.pos>=ins) z.pos+=f.text.length; });
        ins+=f.text.length;
      });
      ed.setSelectionRange(Math.min(bn,ed.value.length), Math.min(bn,ed.value.length));
      toast("Um bloco dobrado foi expandido para preservar o conteúdo.");
    }
  }

  /* guias de indentação */
  function renderGuides(){
    const gi=$("#hlGuideInner"), ed=$("#editor"); if(!gi||!ed) return;
    gi.innerHTML=ed.value.split("\n").map(l=>{ const m=l.match(/^[ \t]{2,}/); return m?'<span class="ig">'+m[0].replace(/\t/g,"  ")+'</span>':""; }).join("\n");
  }

  /* par de chaves/parênteses */
  function bracketPair(v,c){
    const OP={"(":")","[":"]","{":"}"}, CL={")":"(","]":"[","}":"{"};
    let i=-1, ch=null;
    const before=v[c-1], at=v[c];
    if(before && (OP[before]||CL[before])){ i=c-1; ch=before; }
    else if(at && (OP[at]||CL[at])){ i=c; ch=at; }
    if(i<0) return null;
    if(OP[ch]){ let d=0; for(let j=i;j<v.length;j++){ if(v[j]===ch) d++; else if(v[j]===OP[ch]){ d--; if(d===0) return [i,j]; } } }
    else { let d=0; for(let j=i;j>=0;j--){ if(v[j]===ch) d++; else if(v[j]===CL[ch]){ d--; if(d===0) return [j,i]; } } }
    return [i,-1];
  }
  function renderBrackets(){
    const bi=$("#hlBrkInner"), ed=$("#editor"); if(!bi||!ed) return;
    if(ed.selectionStart!==ed.selectionEnd){ if(lastBrk!==""){ lastBrk=""; bi.innerHTML=""; } return; }
    const pair=bracketPair(ed.value, ed.selectionStart);
    const key=pair?pair.join(","):"";
    if(key===lastBrk) return; lastBrk=key;
    if(!pair){ bi.innerHTML=""; return; }
    const v=ed.value, p1=pair[0], p2=pair[1];
    if(p2<0) bi.innerHTML=esc(v.slice(0,p1))+'<mark class="bad">'+esc(v[p1])+'</mark>'+esc(v.slice(p1+1));
    else bi.innerHTML=esc(v.slice(0,p1))+'<mark class="bx">'+esc(v[p1])+'</mark>'+esc(v.slice(p1+1,p2))+'<mark class="bx">'+esc(v[p2])+'</mark>'+esc(v.slice(p2+1));
  }
  function renderCode(){
    const ci=$("#hlCodeInner"), ed=$("#editor"); if(!ci||!ed) return;
    if(!isCode()){ ci.innerHTML=""; return; }
    ci.innerHTML=highlight(ed.value, curLang())+"\n";
  }
  function syncScroll(){
    const ed=$("#editor"); if(!ed) return;
    const gi=$("#gutterInner"); if(gi) gi.style.transform="translateY("+(-ed.scrollTop)+"px)";
    const tx="translate("+(-ed.scrollLeft)+"px,"+(-ed.scrollTop)+"px)";
    ["#hlGuideInner","#hlBrkInner","#hlSearchInner","#hlCodeInner"].forEach(s=>{ const el=$(s); if(el) el.style.transform=tx; });
  }
  const curLine = ed => ed.value.slice(0,ed.selectionStart).split("\n").length;

  function updateStatus(){
    const ed=$("#editor"), t=activeNote();
    const Lb = t?(LANGS[t.lang]||LANGS.text):LANGS.text;
    $("#stLang").textContent = t?Lb.name:"Texto";
    const chip=$("#btnLang"); if(chip){ chip.textContent=Lb.badge; chip.style.color=Lb.color; }

    ed.setSelectionRange(m.index, m.index+m.length);
    const y=(line-1)*21; if(y<ed.scrollTop+21||y>ed.scrollTop+ed.clientHeight-42) ed.scrollTop=Math.max(0,y-ed.clientHeight/2);
    if(!settings.wrap){ const x=col*CW; if(x<ed.scrollLeft||x>ed.scrollLeft+ed.clientWidth-80) ed.scrollLeft=Math.max(0,x-ed.clientWidth/2); }
    syncScroll();
  }
  function replaceOne(){
    const ed=$("#editor"); if(!ed||search.idx<0||!search.matches.length) return;
    const m=search.matches[search.idx]; ed.setRangeText(replaceInput.value, m.index, m.index+m.length, "end"); syncEdited(ed);
    const keep=search.idx; recomputeSearch(false); search.idx=search.matches.length?Math.min(keep,search.matches.length-1):-1;
    renderSearchHl(); updateCount(); if(search.idx>=0) revealMatch(search.idx);
  }
  function replaceAll(){
    const ed=$("#editor"); if(!ed||!search.q) return;
    unfoldAll(true);
    const fl=search.caseSensitive?"g":"gi"; let re; try{ re=new RegExp(escRe(search.q),fl); }catch(_){ return; }
    const n=(ed.value.match(re)||[]).length; ed.value=ed.value.replace(re, replaceInput.value); syncEdited(ed);
    recomputeSearch(true); toast(n?"<b>"+n+"</b> substituições":"Nada a substituir");
  }

  /* ============ ARQUIVOS ============ */
  function downloadText(name, content){ const b=new Blob([content],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
  async function ensureRW(h){ try{ const o={mode:"readwrite"}; if(await h.queryPermission(o)==="granted") return true; return (await h.requestPermission(o))==="granted"; }catch(_){ return false; } }
  async function writeHandle(h,text){ const w=await h.createWritable(); await w.write(text); await w.close(); }
  async function saveTab(t){
    if(!t) return false; const name=ensureExt(t.title); const full=getFullText(t);
    if(t.handle){ try{ if(await ensureRW(t.handle)){ await writeHandle(t.handle,full); t.dirty=false; renderTabs(); toast("Salvo <b>"+esc(name)+"</b>"); return true; } }catch(err){ if(err.name==="AbortError") return false; } }
    if(FS){ try{ const h=await window.showSaveFilePicker({ suggestedName:name, types:[{description:"Texto",accept:{"text/plain":[".txt",".md",".js",".py",".java",".c",".cs",".lua",".sql",".json",".css",".html"]}}] }); await writeHandle(h,full); t.handle=h; t.title=h.name; const dl=detectLangExt(h.name); if(dl) t.lang=dl; t.dirty=false; renderAll(); toast("Salvo <b>"+esc(h.name)+"</b>"); return true; }catch(err){ if(err.name==="AbortError") return false; } }
    downloadText(name,full); t.dirty=false; renderTabs(); toast("Baixado <b>"+esc(name)+"</b>"); return true;
  }
  const saveActive=()=>saveTab(activeNote());
  async function openFiles(){
    if(FS){ try{ const handles=await window.showOpenFilePicker({ multiple:true, excludeAcceptAllOption:false, types:[{description:"Texto e código", accept:{"text/plain":[".txt",".md",".log",".js",".mjs",".cjs",".java",".py",".c",".h",".cs",".lua",".sql",".json",".css",".html",".htm"]}}] });
      for(const h of handles){ const f=await h.getFile(); const text=await f.text(); createNote({ title:uniq(f.name,notes,"title"), content:text, handle:h, lang:detectLangExt(f.name)||"text" }); } return;
    }catch(err){ if(err.name==="AbortError") return; } }
    $("#fileInput").click();
  }
  $("#fileInput").addEventListener("change", e=>{ [...e.target.files].forEach(f=>{ const r=new FileReader(); r.onload=()=>createNote({ title:uniq(f.name,notes,"title"), content:r.result, lang:detectLangExt(f.name)||"text" }); r.readAsText(f); }); e.target.value=""; });

  /* ============ MODAL ============ */
  function modal(o){
    return new Promise(res=>{
      const back=$("#modal"); $("#modalTitle").textContent=o.title||""; $("#modalMsg").innerHTML=o.msg||"";
      const acts=$("#modalActs"); acts.innerHTML="";
      o.buttons.forEach(b=>{ const el=document.createElement("button"); if(b.cls) el.className=b.cls; el.textContent=b.label; el.onclick=()=>done(b.value); acts.appendChild(el); });
      back.classList.add("open");
      const done=v=>{ back.classList.remove("open"); document.removeEventListener("keydown",onKey); back.onclick=null; res(v); };
      back.onclick=e=>{ if(e.target===back) done(o.cancelValue!==undefined?o.cancelValue:false); };
      const onKey=e=>{ if(e.key==="Escape") done(o.cancelValue!==undefined?o.cancelValue:false); };
      document.addEventListener("keydown",onKey);
      setTimeout(()=>{ const p=acts.querySelector(".primary,.danger")||acts.lastChild; p&&p.focus(); },0);
    });
  }

  /* ============ MAPA ============ */
  const mapCanvas=$("#mapCanvas"), wires=$("#wires");
  function renderMapNodes(){
    mapCanvas.querySelectorAll(".map-node").forEach(n=>n.remove());
    notes.forEach(t=>{
      const L=LANGS[t.lang]||LANGS.text, p=t.content.trim();
      const n=document.createElement("div");
      n.className="map-node"+(t.id===activeId?" active-node":""); n.dataset.id=t.id;
      n.style.left=t.x+"px"; n.style.top=t.y+"px";
      n.innerHTML='<div class="head"><span class="mb" style="color:'+L.color+'">'+L.badge+'</span><span class="nt">'+esc(t.title)+'</span>'
        +'<button class="open" title="Abrir no editor"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>'
        +'<div class="body '+(p?"":"ph")+'">'+(p?esc(p.slice(0,180)):"nota vazia")+'</div>'
        +'<button class="link" title="Arraste até outra nota"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>';
      n.querySelector(".open").addEventListener("click", ev=>{ ev.stopPropagation(); openNote(t.id); });
      n.querySelector(".head").addEventListener("mousedown", ev=>startNodeDrag(ev,t,n));
      n.querySelector(".link").addEventListener("mousedown", ev=>startLink(ev,t.id));
      mapCanvas.appendChild(n);
    });
  }
  function updateNodePreview(id){ const t=getNote(id); if(!t) return; const b=mapCanvas.querySelector('.map-node[data-id="'+id+'"] .body'); if(!b) return; const p=t.content.trim(); b.className="body "+(p?"":"ph"); b.textContent=p?p.slice(0,180):"nota vazia"; }
  function nodeCenter(id){ const el=mapCanvas.querySelector('.map-node[data-id="'+id+'"]'); return el?{x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2}:null; }
  function redrawWires(){
    wires.innerHTML=""; mapCanvas.querySelectorAll(".wire-del").forEach(b=>b.remove());
    connections.forEach((c,i)=>{ const A=nodeCenter(c.a),B=nodeCenter(c.b); if(!A||!B) return;
      const ln=document.createElementNS("http://www.w3.org/2000/svg","line"); ln.setAttribute("x1",A.x);ln.setAttribute("y1",A.y);ln.setAttribute("x2",B.x);ln.setAttribute("y2",B.y); wires.appendChild(ln);
      const del=document.createElement("button"); del.className="wire-del"; del.title="Remover conexão"; del.style.left=((A.x+B.x)/2)+"px"; del.style.top=((A.y+B.y)/2)+"px"; del.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'; del.addEventListener("click",()=>{ connections.splice(i,1); redrawWires(); }); mapCanvas.appendChild(del);
    });
  }
  function startNodeDrag(ev,t,node){ if(ev.button!==0) return; ev.preventDefault(); const cr=mapCanvas.getBoundingClientRect(), ox=ev.clientX-cr.left-t.x, oy=ev.clientY-cr.top-t.y;
    const mv=e=>{ t.x=Math.max(0,e.clientX-cr.left-ox); t.y=Math.max(0,e.clientY-cr.top-oy); node.style.left=t.x+"px"; node.style.top=t.y+"px"; redrawWires(); };
    const up=()=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  }
  function startLink(ev,fromId){ if(ev.button!==0) return; ev.preventDefault(); ev.stopPropagation(); const cr=mapCanvas.getBoundingClientRect(), A=nodeCenter(fromId);
    const tmp=document.createElementNS("http://www.w3.org/2000/svg","line"); tmp.setAttribute("class","temp"); tmp.setAttribute("x1",A.x);tmp.setAttribute("y1",A.y);tmp.setAttribute("x2",A.x);tmp.setAttribute("y2",A.y); wires.appendChild(tmp);
    const mv=e=>{ tmp.setAttribute("x2",e.clientX-cr.left); tmp.setAttribute("y2",e.clientY-cr.top); };
    const up=e=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); tmp.remove(); const el=document.elementFromPoint(e.clientX,e.clientY), tn=el&&el.closest(".map-node"); if(tn){ const to=+tn.dataset.id; if(to!==fromId && !connections.some(c=>(c.a===fromId&&c.b===to)||(c.a===to&&c.b===fromId))){ connections.push({a:fromId,b:to}); redrawWires(); } } };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  }

  /* ============ VIEWS + UI ============ */
  function setView(v){ view=v; $("#editorView").classList.toggle("active",v==="editor"); $("#mapView").classList.toggle("active",v==="map"); $("#segEditor").classList.toggle("active",v==="editor"); $("#segMap").classList.toggle("active",v==="map"); if(v==="map"){ renderMapNodes(); redrawWires(); } else loadEditor(); }

  $("#btnSidebar").addEventListener("click", ()=>{ settings.sidebar=!settings.sidebar; document.body.classList.toggle("no-sb", !settings.sidebar); });
  $("#sbNewNote").addEventListener("click", ()=> createNote({}));
  $("#sbNewFolder").addEventListener("click", createFolder);
  $("#btnNew").addEventListener("click", ()=> createNote({}));
  $("#btnOpen").addEventListener("click", openFiles);
  $("#btnSave").addEventListener("click", saveActive);
  $("#btnFind").addEventListener("click", ()=> (searchOpen()&&search.mode==="find")?closeSearch():openSearch("find"));
  $("#btnReplace").addEventListener("click", ()=> (searchOpen()&&search.mode==="replace")?closeSearch():openSearch("replace"));
  $("#btnWrap").addEventListener("click", e=>{ settings.wrap=!settings.wrap; e.currentTarget.classList.toggle("on",settings.wrap); $("#stWrap").textContent=settings.wrap?"quebra automática":"sem quebra"; const ed=$("#editor"); if(ed) ed.classList.toggle("wrap",settings.wrap); ["#hlGuideInner","#hlBrkInner","#hlSearchInner","#hlCodeInner"].forEach(s=>{const el=$(s); if(el) el.classList.toggle("wrap",settings.wrap);}); });
  $("#btnLines").addEventListener("click", e=>{ settings.lineNumbers=!settings.lineNumbers; e.currentTarget.classList.toggle("on",settings.lineNumbers); const g=$("#gutter"); if(g) g.style.display=settings.lineNumbers?"":"none"; if(settings.lineNumbers) renderGutter(); });
  $("#segEditor").addEventListener("click", ()=> setView("editor"));
  $("#segMap").addEventListener("click", ()=> setView("map"));
  $("#findClose").addEventListener("click", closeSearch);
  $("#findNext").addEventListener("click", ()=> goMatch(1));
  $("#findPrev").addEventListener("click", ()=> goMatch(-1));
  $("#replOne").addEventListener("click", replaceOne);
  $("#replAll").addEventListener("click", replaceAll);
  findInput.addEventListener("input", ()=> recomputeSearch(true));
  findInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); goMatch(e.shiftKey?-1:1); } if(e.key==="Escape") closeSearch(); });
  replaceInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); replaceOne(); } if(e.key==="Escape") closeSearch(); });
  caseSens.addEventListener("change", ()=> recomputeSearch(true));

  document.addEventListener("keydown", e=>{
    const mod=e.ctrlKey||e.metaKey;
    if(mod && e.key.toLowerCase()==="s"){ e.preventDefault(); saveActive(); }
    else if(mod && e.key.toLowerCase()==="o"){ e.preventDefault(); openFiles(); }
    else if(mod && e.key.toLowerCase()==="n"){ e.preventDefault(); createNote({}); }
    else if(mod && e.key.toLowerCase()==="f"){ e.preventDefault(); openSearch("find"); }
    else if(mod && e.key.toLowerCase()==="h"){ e.preventDefault(); openSearch("replace"); }
    else if(e.altKey && e.shiftKey && e.key.toLowerCase()==="f"){ e.preventDefault(); formatDoc(); }
  });
  window.addEventListener("beforeunload", e=>{ if(notes.some(t=>t.dirty)){ e.preventDefault(); e.returnValue=""; } });

  /* ============ SEED ============ */
  const fSnips={ id:"f"+(fuid++), name:"Trechos de código", collapsed:false };
  folders.push(fSnips);

  createNote({ title:"bem-vindo.txt", open:true, x:90, y:100, content:
"Trama — editor de texto e código, leve, no navegador.\n\n"+
"NOVIDADES\n"+
"  • Realce de sintaxe: Java, JavaScript, HTML, Python, C, C#, Lua, SQL, JSON, CSS e Node.\n"+
"    Troque a linguagem no canto inferior direito (ou é detectada pela extensão do arquivo).\n"+
"  • Indentação inteligente: Enter mantém o recuo, abre bloco depois de { ( [ ou : (Python),\n"+
"    fecha pares automaticamente e o Tab/Shift+Tab indenta a seleção.\n"+
"  • Pastas: crie pastas na barra lateral, guarde notas dentro e recolha a pasta para\n"+
"    escondê-las. Elas continuam guardadas e você abre quando quiser.\n\n"+
"DICAS\n"+
"  • Barra lateral: botão de painel no topo (ao lado do logo).\n"+
"  • Botão ··· em cada nota: renomear, mover para pasta, excluir.\n"+
"  • Fechar aba NÃO apaga a nota — ela fica na barra lateral. Excluir é que remove.\n" });

  createNote({ title:"ideias.txt", open:false, x:430, y:300, content:"Rascunho de ideias…\n\n- \n- \n- " });

  createNote({ folderId:fSnips.id, open:true, x:150, y:470, title:"consulta.sql", content:
"-- exemplo de consulta\nSELECT r.nome, COUNT(*) AS total\nFROM recurso r\nJOIN evento e ON e.recurso_id = r.id\nWHERE e.data >= '2024-01-01'\nGROUP BY r.nome\nORDER BY total DESC;" });

  createNote({ folderId:fSnips.id, open:false, x:470, y:560, title:"objeto.lua", content:
"-- exemplo em Lua\nlocal function montar(dt)\n  local ret = {}\n  for _, item in ipairs(dt.itens) do\n    table.insert(ret, item)\n  end\n  return ret\nend\n\nreturn montar" });

  createNote({ folderId:fSnips.id, open:false, x:780, y:360, title:"app.js", content:
"// exemplo em JavaScript / Node\nconst soma = (a, b) => a + b;\n\nfunction principal() {\n  const total = [1, 2, 3].reduce(soma, 0);\n  console.log(`total: ${total}`);\n}\n\nprincipal();" });

  connections.push({ a:notes[0].id, b:notes[1].id });
  connections.push({ a:notes[2].id, b:notes[3].id });

  renderAll(); loadEditor();
})();
</script>
</body>
